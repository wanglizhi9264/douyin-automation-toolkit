<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>抖音备份</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="collapsed">
    <div id="floatingDock">
      <nav id="quickMenu" aria-label="快捷下载" hidden>
        <button data-quick="liked" title="下载喜欢" aria-label="下载喜欢">
          喜欢
        </button>
        <button data-quick="bookmarked" title="下载收藏" aria-label="下载收藏">
          收藏
        </button>
        <button
          data-quick="following"
          title="选择关注作者"
          aria-label="选择关注作者"
        >
          关注
        </button>
      </nav>
      <button
        id="floating"
        title="展开抖音备份"
        aria-label="展开抖音备份"
        aria-expanded="false"
        aria-controls="quickMenu"
      >
        <svg
          id="floatingProgress"
          viewBox="0 0 60 60"
          aria-hidden="true"
          hidden
        >
          <circle class="ring-track" cx="30" cy="30" r="28" />
          <circle id="floatingArc" cx="30" cy="30" r="28" pathLength="100" />
        </svg>
        <img src="../icons/archive.svg" alt="" /><span
          id="runningDot"
          hidden
        ></span>
      </button>
      <button id="floatingClose" aria-label="关闭插件" title="关闭并暂停下载">
        ×
      </button>
    </div>
    <div id="shell">
      <header>
        <div class="brand">
          <img src="../icons/archive.svg" alt="" /><span>抖音备份</span>
        </div>
        <div class="window-actions">
          <button id="menuBtn" aria-label="更多操作" title="更多操作">
            ···</button
          ><button
            id="collapseBtn"
            aria-label="最小化"
            title="最小化，下载继续"
          >
            −</button
          ><button id="closeBtn" aria-label="关闭插件" title="关闭并暂停下载">
            ×
          </button>
        </div>
      </header>
      <main id="view" aria-live="polite"></main>
      <div id="notice" role="status" hidden></div>
      <footer>
        <span id="account">本地备份 · v0.8.6</span
        ><span id="footState"></span>
      </footer>
    </div>
    <script type="module" src="./modern-app.js"></script>
  </body>
</html>
